# omni-route Docker 专用配置：数据写入挂载卷 /data，监听容器内 8080。
listen: ":8080"
api_keys: []
seed: 42

log:
  level: info
  format: text

store:
  path: /data/omni.db
  flush_interval_ms: 200
  batch_size: 64

# 演示用内置 mock provider；生产请换成 config.example.yaml 里的真实 provider。
providers:
  mock:
    kind: mock
    base_url: ""
    mock:
      latency_ms: 120
      jitter_ms: 60
      stream_chunk_delay_ms: 15
      bad_json_rate: 0.25
      short_rate: 0.15

models:
  mock-fast:
    provider: mock
    price_in: 0.10
    price_out: 0.40
    caps: { streaming: true, tools: false, json_mode: true, max_context_tokens: 8192 }
    mock_tier: fast
  mock-mid:
    provider: mock
    price_in: 0.60
    price_out: 2.40
    caps: { streaming: true, tools: true, json_mode: true, max_context_tokens: 32768 }
    mock_tier: mid
  mock-premium:
    provider: mock
    price_in: 2.50
    price_out: 10.00
    caps: { streaming: true, tools: true, json_mode: true, max_context_tokens: 128000 }
    mock_tier: premium

routing:
  mode: cascade
  default_model: mock-mid
  budget_per_task:
    code: 2.00
    reasoning: 2.50
    summarization: 1.00
    translation: 1.00
    extraction: 1.00
    chat: 0.80
  baseline:
    code: mock-premium
    reasoning: mock-premium
    summarization: mock-premium
    translation: mock-premium
    extraction: mock-premium
    chat: mock-premium
  lambda: { init: 50, min: 1, max: 5000, eta: 0.05 }

cascades:
  code: [mock-fast, mock-mid, mock-premium]
  reasoning: [mock-mid, mock-premium]
  summarization: [mock-fast, mock-mid]
  translation: [mock-fast, mock-mid]
  extraction: [mock-fast, mock-mid]
  chat: [mock-fast, mock-mid]

cache:
  enabled: true
  mode: zero_temp

cascade:
  max_upgrades: 2
  confidence:
    threshold: 0.60
    use_format: true
    use_heuristic: true
